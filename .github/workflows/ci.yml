# CI: тесты + секрет-скан (gitleaks CLI, MIT) + сборка lite-образа.
# Actions закреплены полным SHA коммита; рядом — тег версии и SPDX-лицензия.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7.0.1 — license: MIT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-python@v7.0.0 — license: MIT
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt --require-hashes
          pip install pytest pytest-asyncio httpx

      - name: Unit tests
        env:
          APP_ENV: dev
          API_KEYS: test-key
        run: pytest -q -m "not live"

      - name: Gitleaks (CLI MIT)
        # gitleaks CLI: https://github.com/gitleaks/gitleaks — license: MIT
        # (не используем gitleaks-action: у action коммерческая лицензия)
        run: |
          set -euo pipefail
          VER=8.24.0
          curl -sSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --verbose --no-git

  docker-lite:
    runs-on: ubuntu-latest
    needs: test
    steps:
      # actions/checkout@v7.0.1 — license: MIT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # docker/setup-buildx-action@v4.4.1 — license: Apache-2.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # docker/build-push-action@v7.4.0 — license: Apache-2.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: false
          load: true
          tags: parser-service:ci-lite
          build-args: |
            VARIANT=lite
            VERSION=0.0.0-ci
            GIT_COMMIT=${{ github.sha }}

      - name: Image size check (lite ≤ 300MB)
        run: |
          bytes=$(docker image inspect parser-service:ci-lite --format '{{.Size}}')
          echo "lite size: $bytes bytes"
          python3 -c "import sys; b=int(sys.argv[1]); sys.exit(0 if b <= 300*1024*1024 else 1)" "$bytes"
