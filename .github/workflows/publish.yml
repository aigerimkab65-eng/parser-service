# Сборка и публикация образов в ghcr.io (lite + full).
# Теги: {version}-lite / {version}-full и sha-... (без latest).
# Запуск вручную или по git-тегу v*.
#
# Actions закреплены полным SHA; рядом — тег версии и SPDX-лицензия.

name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия образа (например 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [lite, full]
    steps:
      # actions/checkout@v7.0.1 — license: MIT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # docker/setup-qemu-action@v4.4.0 — license: Apache-2.0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      # docker/setup-buildx-action@v4.4.1 — license: Apache-2.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # docker/login-action@v4.6.0 — license: Apache-2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"

      # docker/build-push-action@v7.4.0 — license: Apache-2.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.ver.outputs.owner }}/parser-service:${{ steps.ver.outputs.version }}-${{ matrix.variant }}
            ghcr.io/${{ steps.ver.outputs.owner }}/parser-service:sha-${{ github.sha }}-${{ matrix.variant }}
          build-args: |
            VARIANT=${{ matrix.variant }}
            VERSION=${{ steps.ver.outputs.version }}
            GIT_COMMIT=${{ steps.ver.outputs.commit }}
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ steps.ver.outputs.commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # aquasecurity/trivy-action@v0.36.0 — license: Apache-2.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/${{ steps.ver.outputs.owner }}/parser-service:${{ steps.ver.outputs.version }}-${{ matrix.variant }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
