# Локальная проверка на Mac (в т.ч. Apple Silicon / arm64).
# Порт только на 127.0.0.1:8000. APP_ENV=dev разрешает учебный ключ.
#
# Из корня репозитория:
#   docker compose -f deploy/compose.local.yml up --build -d
#   curl -s http://127.0.0.1:8000/health

services:
  parser:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VARIANT: lite
        VERSION: ${APP_VERSION:-1.0.0}
        GIT_COMMIT: ${GIT_COMMIT:-local}
    image: parser-service:lite
    restart: unless-stopped
    environment:
      APP_ENV: dev
      API_KEYS: ${API_KEYS:-dev-key-change-me}
      PARSER_VARIANT: lite
      BROWSER_ENABLED: "false"
      UI_ENABLED: "true"
      DOCS_ENABLED: "false"
      RESPECT_ROBOTS: "false"
      APP_VERSION: ${APP_VERSION:-1.0.0}
      GIT_COMMIT: ${GIT_COMMIT:-local}
    ports:
      - "127.0.0.1:8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
