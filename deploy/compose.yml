# Готовый образ из GitHub Container Registry (без сборки).
# Другие сервисы в той же сети ходят на http://parser:8000
# Порты наружу НЕ открыты.
#
#   export API_KEYS="$(openssl rand -hex 32)"
#   docker compose -f deploy/compose.yml up -d

services:
  parser:
    image: ghcr.io/aigerimkab65-eng/parser-service:1.0-lite
    restart: unless-stopped
    environment:
      APP_ENV: production
      API_KEYS: ${API_KEYS:?Задайте API_KEYS (openssl rand -hex 32)}
      PARSER_VARIANT: lite
      BROWSER_ENABLED: "false"
      UI_ENABLED: "false"
      DOCS_ENABLED: "false"
      RESPECT_ROBOTS: "true"
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-60}
      FETCH_TIMEOUT_S: ${FETCH_TIMEOUT_S:-15}
      MAX_PAGE_MB: ${MAX_PAGE_MB:-5}
    expose:
      - "8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - parser_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  parser_net:
    driver: bridge
    name: parser_net
